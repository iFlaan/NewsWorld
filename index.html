<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>NewsWorld — خريطة الأخبار الحية</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

  <link href="https://unpkg.com/maplibre-gl@^5/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@^5/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- الخريطة تغطي الشاشة بالكامل -->
  <div id="map"></div>

  <!-- ===== شريط علوي زجاجي ===== -->
  <header class="glass top-bar">
    <div class="brand">
      <span class="pulse-dot"></span>
      <h1>NewsWorld</h1>
      <span class="live-tag">LIVE</span>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="search" placeholder="ابحث في الأخبار والأماكن…" autocomplete="off">
    </div>

    <div class="top-actions">
      <button id="btn-theme" class="icon-btn" title="تبديل النمط" aria-label="تبديل النمط">◐</button>
      <button id="btn-refresh" class="icon-btn" title="تحديث" aria-label="تحديث">⟳</button>
    </div>
  </header>

  <!-- ===== شريط التصفية الزجاجي ===== -->
  <nav class="glass filter-bar" id="filters" aria-label="تصفية الطبقات"></nav>

  <!-- ===== لوحة الأخبار الجانبية (قابلة للطي) ===== -->
  <aside class="glass side-panel" id="panel">
    <div class="panel-head">
      <h2 id="panel-title">آخر الأحداث</h2>
      <button id="panel-close" class="icon-btn" aria-label="إغلاق">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <!-- ===== زر فتح اللوحة (يظهر عند إغلاقها) ===== -->
  <button class="glass fab" id="panel-open" aria-label="فتح لوحة الأخبار">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 6h16M4 12h16M4 18h10"/>
    </svg>
  </button>

  <!-- ===== مؤشر التحميل ===== -->
  <div class="loader glass" id="loader">
    <span class="spinner"></span>
    <span>جارٍ تحميل الأحداث الحقيقية…</span>
  </div>

  <!-- ===== بطاقة التفاصيل العائمة ===== -->
  <div class="glass detail-card" id="detail" hidden></div>

  <footer class="glass status-bar" id="status"></footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
